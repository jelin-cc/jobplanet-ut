<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Jobplanet Home A</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{
    --green-500:#00C274; --green-600:#00A866; --green-50:#E3F8ED;
    --g900:#242628; --g800:#323438; --g700:#4B4C50; --g600:#57595B; --g500:#686A6D;
    --g400:#85878C; --g300:#A4A6AD; --g200:#C5C7CC; --g100:#E5E6E9; --g50:#F3F3F4;
    --red-400:#EF5350; --red-30:#FFF7F7;
    --yellow-50:#FAF9EC; --yellow-600:#D79304;
    --blue-50:#ECF6FE; --blue-600:#1E88E5;
    --orange-500:#FF9800;
    --jk:#083CCC; --jk-line:#96B1FD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif; background:#DDE1E6;
       display:flex; justify-content:center; min-height:100vh;}

  /* ===== device frame / scroller ===== */
  .frame{position:relative; width:393px; height:100vh; max-height:852px; overflow-y:auto; overflow-x:hidden;
         background:linear-gradient(180deg,#CFF6E2 0,#E2F5EC 180px,#F4F6F8 360px,#F9F9FB 520px) #F9F9FB;
         background-attachment:local;
         box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .frame::-webkit-scrollbar{display:none;}

  /* ===== sticky topbar ===== */
  .topbar{position:sticky; top:0; z-index:50; padding:0 16px; --p:0;
          background:rgba(255,255,255,var(--p));
          box-shadow:0 4px 16px rgba(0,0,0,calc(.08 * var(--p)));}

  .statusbar{height:44px; display:flex; align-items:center; justify-content:space-between;
             font-size:15px; font-weight:600; color:var(--g900);}
  .statusbar .sb-ic{display:flex; gap:5px; align-items:center;}

  .collapsible{overflow:hidden;
    max-height:calc(var(--h) * (1 - var(--p)));
    opacity:calc(1 - var(--p));}

  /* icon row (bell + menu) */
  .iconrow{--h:40px; display:flex; justify-content:flex-end; align-items:center; gap:6px;}
  .iconrow .ibtn{width:32px; height:32px; display:flex; align-items:center; justify-content:center; color:var(--g800);}

  /* logo */
  .logorow{--h:48px; display:flex; justify-content:center; align-items:center; padding-bottom:14px;}
  .logo{font-size:26px; font-weight:800; color:var(--green-500); letter-spacing:-.5px;}

  /* search row */
  .searchrow{display:flex; align-items:center; gap:8px;
             padding-bottom:calc(14px - 6px * var(--p)); padding-top:calc(2px * var(--p));}
  .search{flex:1; height:calc(56px - 12px * var(--p)); display:flex; align-items:center; gap:4px;
          padding:0 18px 0 24px; background:#fff; border-radius:999px;
          border:2px solid var(--green-500);
          box-shadow:0 0 24px rgba(184,235,208,calc(.5 - .5 * var(--p)));}
  .search input{flex:1; border:none; outline:none; font-size:15px; color:var(--g900);
                font-family:inherit; background:transparent;}
  .search input::placeholder{color:var(--g400);}
  .search .s-ic{color:var(--g400); display:flex;}
  .menu-compact{width:24px; height:24px; align-items:center; justify-content:center; color:var(--g600);
                display:flex; overflow:hidden; opacity:var(--p); max-width:calc(28px * var(--p));}

  /* ranking ticker */
  .ticker{--h:54px; display:flex; align-items:center; gap:8px; padding:0 6px 14px;}
  .ticker .rank{display:flex; align-items:center; gap:8px; flex:1;}
  .ticker .rnum{color:var(--green-500); font-size:14px; font-weight:600;}
  .ticker .rname{color:#000; font-size:14px; font-weight:600;}
  .ticker .newbadge{background:var(--green-50); color:var(--green-600); font-size:11px; font-weight:600;
                    padding:2px 6px; border-radius:4px;}
  .ticker .delta{display:flex; align-items:center; gap:2px; color:var(--red-400); font-size:13px; font-weight:600;}
  .ticker .chev{width:24px; height:24px; display:flex; align-items:center; justify-content:center;
                background:#fff; border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,.08); color:var(--g600);}

  /* quick menu */
  .quick{--h:120px; display:flex; justify-content:center; gap:16px; padding:6px 0 22px;}
  .qitem{width:72px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .qicon{width:60px; height:60px; border-radius:16px; background:#fff; display:flex; align-items:center;
         justify-content:center; font-size:30px; box-shadow:0 4px 16px rgba(0,0,0,.08);}
  .qlabel{font-size:13px; font-weight:600; color:var(--g800);}

  /* ===== HOT pill ===== */
  .hot{margin:2px 24px 0; padding:12px 14px; background:var(--red-30); border-radius:999px;
       box-shadow:0 4px 16px rgba(0,0,0,.08); display:flex; align-items:center; gap:8px;}
  .hot .htag{background:#fff; color:var(--red-400); font-size:12px; font-weight:600;
             padding:4px 10px; border-radius:999px;}
  .hot .htx{flex:1; color:var(--red-400); font-size:12px; font-weight:600;}
  .hot .hchev{color:var(--g400); display:flex;}

  /* ===== white sheet ===== */
  .sheet{margin-top:20px; background:#fff; border-radius:20px 20px 0 0;
         box-shadow:0 -2px 16px rgba(0,0,0,.05); padding:24px 0 100px;
         display:flex; flex-direction:column; gap:36px;}

  .module{padding:0 16px;}
  .mhead{display:flex; align-items:center; gap:16px; margin-bottom:16px;}
  .mhead .mleft{flex:1; display:flex; align-items:center; gap:6px;}
  .mtitle{display:flex; align-items:center; gap:4px; font-size:18px; font-weight:700; color:var(--g900); line-height:26px;}
  .mtitle .micon{font-size:22px;}
  .adbadge{display:inline-flex; align-items:center; gap:1px; height:20px; padding:2px 6px;
           border:1px solid var(--g100); border-radius:6px; color:var(--g200); font-size:11px; font-weight:600;}
  .more{display:flex; align-items:center; gap:2px; color:var(--g400); font-size:13px; font-weight:600; white-space:nowrap;}

  /* horizontal carousel track */
  .track{display:flex; gap:12px; overflow-x:auto; padding:0 16px 4px; margin:0 -16px;
         scroll-snap-type:x mandatory;}
  .track::-webkit-scrollbar{display:none;}
  .track > *{scroll-snap-align:start; flex:0 0 auto;}

  /* ===== job card ===== */
  .jcard{width:280px; padding:16px 20px 20px; background:#fff; border:1px solid var(--g100);
         border-radius:12px; display:flex; flex-direction:column;}
  .jc-top{display:flex; align-items:center; gap:10px;}
  .jc-co{flex:1; display:flex; align-items:center; gap:6px;}
  .jc-logo{width:32px; height:32px; border-radius:8px; border:1px solid var(--g100); display:flex;
           align-items:center; justify-content:center; font-size:8px; font-weight:700; color:var(--g400);}
  .jc-coname{color:var(--g500); font-size:13px; font-weight:600;}
  .jc-bm{color:var(--g200); display:flex;}
  .jc-title{margin-top:6px; color:var(--g900); font-size:15px; font-weight:600; line-height:24px;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:48px;}
  .jc-meta{margin-top:4px; display:flex; align-items:center; gap:4px; font-size:12px;}
  .jc-dday{color:var(--red-400); font-weight:500;}
  .jc-dot{color:var(--g300); font-size:11px;}
  .jc-sub{color:var(--g300); font-weight:500;}
  .jc-bottom{margin-top:14px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; min-height:24px;}
  .jc-tags{display:flex; gap:4px; flex-wrap:wrap;}
  .tag{height:20px; display:inline-flex; align-items:center; gap:2px; padding:2px 6px; border-radius:4px;
       font-size:11px; font-weight:600;}
  .tag.yellow{background:var(--yellow-50); color:var(--yellow-600);}
  .tag.green{background:var(--green-50); color:var(--green-600);}
  .jc-jk{height:32px; padding:0 10px; display:flex; align-items:center; background:#fff; border-radius:6px;
         border:1px solid var(--jk-line); color:var(--jk); font-size:13px; font-weight:600; white-space:nowrap;}

  /* ===== review feed card ===== */
  .rcard{padding:24px; background:linear-gradient(180deg,#FFF3E0 0%,#fff 100%);
         border-radius:16px; border:1px solid rgba(36,38,40,.10); display:flex; flex-direction:column; gap:16px;
         margin-bottom:16px;}
  .module .rcard:last-child{margin-bottom:0;}
  .rc-quote{color:var(--g900); font-size:15px; font-weight:600; line-height:24px;}
  .rc-snip{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .tag.blue{background:var(--blue-50); color:var(--blue-600);}
  .rc-snip .rc-txt{flex:1; color:var(--g500); font-size:14px; line-height:22px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rc-detail{height:44px; display:flex; align-items:center; justify-content:center; gap:2px;
             background:#fff; border:1px solid var(--g100); border-radius:8px;
             color:var(--g700); font-size:12px; font-weight:600;}
  .rc-div{height:1px; background:var(--g50);}
  .rc-co{display:flex; align-items:center; gap:6px;}
  .rc-co .jc-logo{width:32px; height:32px;}
  .rc-co .name{color:var(--g800); font-size:14px; font-weight:600;}

  /* ===== theme card ===== */
  .theme-list{display:flex; flex-direction:column; gap:16px;}
  .tcard{border-radius:20px; overflow:hidden; border:1px solid rgba(36,38,40,.10);}
  .tc-img{height:142px; padding:16px; display:flex; align-items:flex-start;
          background:linear-gradient(135deg,#cfd8e3,#aeb8c7);}
  .tc-pill{padding:4px 12px; background:rgba(0,0,0,.8); border-radius:999px;
           color:#fff; font-size:13px; font-weight:600;}
  .tc-body{padding:20px 20px 28px; background:#fff;}
  .tc-title{color:var(--g900); font-size:18px; font-weight:700; line-height:26px;}
  .tc-sub{color:var(--g400); font-size:15px; line-height:24px; margin-top:2px;}

  /* ===== popular post card ===== */
  .pcard{width:280px; height:220px; padding:20px 20px 14px; background:#fff; border:1px solid var(--g100);
         border-radius:12px; display:flex; flex-direction:column; justify-content:space-between;}
  .pc-body{color:var(--g800); font-size:16px; line-height:24px; overflow:hidden;
           display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical;}
  .pc-foot{display:flex; align-items:center; gap:20px; color:var(--g300); font-size:14px;}
  .pc-foot .grp{display:flex; align-items:center; gap:12px;}
  .pc-foot .it{display:flex; align-items:center; gap:6px;}
  .pc-foot .view{flex:1; text-align:right;}

  /* ===== bottom nav ===== */
  .bottomnav{position:sticky; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--g100);
             display:flex; padding-bottom:8px;}
  .nav-it{flex:1; padding:8px 0 4px; display:flex; flex-direction:column; align-items:center; gap:5px;
          color:var(--g300); font-size:11px; font-weight:500;}
  .nav-it.active{color:var(--g900);}
  .nav-it.active svg{color:var(--g800);}
  .home-ind{height:5px; width:140px; margin:6px auto 0; background:#1A1A1E; border-radius:10px;}
</style>
</head>

<script>
  // ===== collapse on scroll =====
  const frame = document.getElementById('frame');
  const topbar = document.getElementById('topbar');
  const RANGE = 96; // 스크롤 0~96px 구간에서 헤더가 점진적으로 접힘
  function onScroll(){
    const p = Math.min(Math.max(frame.scrollTop / RANGE, 0), 1);
    topbar.style.setProperty('--p', p.toFixed(3));
  }
  frame.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  // ===== job cards =====
  const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const bm = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';

  const tagYellow = '<span class="tag yellow">🎁 축하금 100만원</span>';
  const tagGreen  = '<span class="tag green">워라밸 4.0</span>';

  function jobCard(opt){
    const tags = (opt.tags||[]).join('');
