<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헤더 검색바 확장 인터랙션</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --brand: #00C274;
    --white: #ffffff;
    --gray-900: #242628;
    --gray-800: #323438;
    --gray-700: #4B4C50;
    --gray-500: #686A6D;
    --gray-300: #A4A6AD;
    --gray-200: #D2D4DA;
    --gray-100: #E5E6E9;
    --gray-50: #F3F3F4;
    --gray-30: #F9F9FB;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --search-w: 620px;   /* 확장된 검색바 = 드롭다운 공통 너비 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Pretendard, -apple-system, sans-serif;
    background: #fafafa;
    min-height: 100vh;
  }

  /* ===== Header ===== */
  .header-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 100;
  }
  .header {
    align-self: stretch;
    height: 56px;
    padding: 0 360px;
    background: var(--white);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .header-inner {
    width: 1200px;
    flex: 1 1 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-divider {
    align-self: stretch;
    height: 1px;
    background: var(--gray-100);
  }

  /* GNB (좌측 로고 + 메뉴) */
  .gnb {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 34px;
  }
  .logo {                 /* 항상 노출 */
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .logo img { height: 26px; display: block; }
  /* 메인 메뉴: 확장 시 이 그룹만 숨김 */
  .gnb-menus {
    display: flex;
    align-items: center;
    gap: 34px;
    overflow: hidden;
    white-space: nowrap;
    transition: opacity .22s var(--ease), width .28s var(--ease),
                margin .28s var(--ease), transform .28s var(--ease);
    transform-origin: left center;
  }
  .gnb-menu {
    height: 38px;
    display: flex;
    align-items: center;
  }
  .gnb-menu span {
    color: var(--gray-800);
    font-size: 15px;
    font-weight: 600;
    line-height: 24px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* 우측 영역 */
  .header-right {
    align-self: stretch;
    padding: 10px 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 24px;
    /* 검색 확장 시 검색바가 좌측으로 늘어날 수 있도록 우측 그룹은 고정 */
  }

  /* ===== 검색바 ===== */
  .search {
    width: 188px;
    height: 40px;
    padding: 11px 16px;
    background: var(--gray-50);
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: text;
    border: 1px solid transparent;
    outline: none;
    /* 핵심: width / transform / shadow 동시 트랜지션 */
    transition: width .26s var(--ease), transform .26s var(--ease),
                background .2s var(--ease), box-shadow .2s var(--ease);
  }
  .search:hover { background: #ededee; }
  .search input {
    flex: 1 1 0;
    border: none;
    background: transparent;
    outline: none;
    font-family: Pretendard;
    font-size: 14px;
    font-weight: 400;
    color: var(--gray-900);          /* filled 텍스트 Gray-900 */
    caret-color: var(--brand);        /* 커서 Green-500 */
    min-width: 0;
  }
  .search input::placeholder { color: var(--gray-300); }
  .search-actions {
    display: flex;
    align-items: center;
    gap: 8px;                         /* 클리어 ↔ 돋보기 8px */
    flex-shrink: 0;
  }
  .search .icon-search {
    width: 14px; height: 14px;
    color: var(--gray-300);
  }
  .search .icon-clear {
    width: 12px; height: 12px;
    color: var(--gray-300);
    cursor: pointer;
    display: none;
  }
  .search .icon-clear:hover { color: var(--gray-500); }

  /* 우측 아이콘들 */
  .right-icons {
    display: flex;
    align-items: center;
    gap: 16px;
    transition: opacity .2s var(--ease);
  }
  .right-icons .ic { width: 18px; height: 18px; color: var(--gray-500); cursor: pointer; }
  .profile {
    display: flex; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .profile .avatar {
    width: 32px; height: 32px; padding: 8px;
    background: var(--gray-30);
    border-radius: 6px;
    border: 1px solid var(--gray-100);
    display: flex; justify-content: center; align-items: center;
    color: var(--gray-500);
  }
  .profile .chev { width: 14px; height: 14px; color: var(--gray-300); }

  /* 비로그인 영역 */
  .right-auth {
    display: none;
    align-items: center;
    gap: 4px;
  }
  .auth-btn {
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    color: var(--gray-500);
    white-space: nowrap;
    cursor: pointer;
  }
  .auth-btn:hover { background: var(--gray-30); }
  .auth-divider {
    width: 1px; height: 13px;
    background: var(--gray-100);
    margin: 0 6px;
  }
  /* 로그인/비로그인 상태 토글 */
  .header-wrap.logged-out .right-icons { display: none; }
  .header-wrap.logged-out .right-auth { display: flex; }

  /* ===== 확장 상태 (active) ===== */
  /* 메인 메뉴만 숨김 — 로고/우측 아이콘은 유지 */
  .header-wrap.active .gnb-menus {
    width: 0;
    margin-left: -34px;   /* 로고와의 gap까지 제거 */
    opacity: 0;
    transform: translateX(-12px);
    pointer-events: none;
  }
  .header-wrap.active .search {
    width: var(--search-w);
    /* 색상 유지: Gray-50 그대로, 흰색 전환 없음 */
  }

  /* ===== 드롭다운 ===== */
  .search-dropdown {
    position: absolute;
    top: 52px;
    left: 50%;
    width: var(--search-w);   /* 검색바와 동일 너비 */
    background: var(--white);
    border: 1px solid var(--gray-100);
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
    opacity: 0;
    transform: translateX(-50%) translateY(-8px);  /* 검색바와 동일하게 화면 중앙 정렬 */
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .header-wrap.active .search-dropdown {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .sugg-list { padding: 8px 0; }
  .sugg-row {
    display: flex; align-items: center; gap: 8px;
    height: 42px; padding: 9px 20px;
    cursor: pointer;
  }
  .sugg-row:hover { background: var(--gray-30); }
  .sugg-row .ic { width: 16px; height: 16px; color: var(--gray-300); flex-shrink: 0; }
  .sugg-row .label {
    font-size: 14px; font-weight: 600; line-height: 22px;
    color: var(--gray-900);
  }
  .sugg-row .label .hl { color: var(--brand); }   /* 입력 글자 메인 그린 하이라이트 */
  .sugg-empty {
    padding: 28px 20px; text-align: center;
    color: var(--gray-300); font-size: 14px;
  }
  .sugg-footer {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 12px 20px;
    border-top: 1px solid var(--gray-100);
  }
  .sugg-close {
    font-size: 13px; font-weight: 600; color: var(--gray-700);
    cursor: pointer;
  }
  .sugg-close:hover { color: var(--gray-900); }

  /* dim 배경 */
  .dim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.32);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s var(--ease);
    z-index: 50;
  }
  .dim.active { opacity: 1; pointer-events: auto; }

  /* 데모 안내 */
  .demo-note {
    max-width: 560px; margin: 80px auto; text-align: center;
    color: var(--gray-500); font-size: 15px; line-height: 1.7;
  }
  .demo-note b { color: var(--gray-800); }
  .demo-note kbd {
    background: var(--gray-50); border: 1px solid var(--gray-200);
    border-radius: 6px; padding: 2px 8px; font-size: 13px; color: var(--gray-800);
  }
</style>
</head>
<body>

<div class="dim" id="dim"></div>

<div class="header-wrap" id="headerWrap">
  <div class="header">
    <div class="header-inner">
      <!-- 좌측 GNB -->
      <div class="gnb">
        <div class="logo"><img src="logo.png" alt="Jobplanet"></div>
        <div class="gnb-menus">
          <div class="gnb-menu"><span>리뷰 피드</span></div>
          <div class="gnb-menu"><span>채용 공고</span></div>
          <div class="gnb-menu"><span>잡플위키</span></div>
          <div class="gnb-menu"><span>커뮤니티</span></div>
          <div class="gnb-menu"><span>멤버십</span></div>
        </div>
      </div>

      <!-- 우측 -->
      <div class="header-right">
        <div class="search" id="search">
          <input type="text" id="searchInput" placeholder="기업, 공고 검색" autocomplete="off">
          <div class="search-actions">
            <svg class="icon-clear" id="iconClear" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="11" fill="currentColor"/>
              <line x1="8.5" y1="8.5" x2="15.5" y2="15.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
              <line x1="15.5" y1="8.5" x2="8.5" y2="15.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </div>
        </div>

        <div class="right-icons">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
          <div class="profile" id="profileBtn" title="클릭 시 로그아웃">
            <div class="avatar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </div>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>
        </div>

        <!-- 비로그인 상태 -->
        <div class="right-auth">
          <span class="auth-btn" id="loginBtn">로그인</span>
          <span class="auth-btn">회원가입</span>
          <span class="auth-divider"></span>
          <span class="auth-btn">기업 회원 서비스</span>
        </div>
      </div>
    </div>
  </div>
  <div class="header-divider"></div>

  <!-- 드롭다운 (Search Suggestion List) -->
  <div class="search-dropdown" id="dropdown">
    <div class="sugg-list" id="suggList"></div>
    <div class="sugg-footer"><span class="sugg-close" id="closeBtn">닫기</span></div>
  </div>
</div>

<div class="demo-note">
  <p>우측 <b>검색바를 클릭</b>하면 GNB가 페이드아웃되고 검색바가 크게 확장됩니다.<br>
  바깥 영역을 클릭하거나 <kbd>ESC</kbd>를 누르면 원래대로 돌아옵니다.</p>
</div>

<script>
  const wrap = document.getElementById('headerWrap');
  const search = document.getElementById('search');
  const input = document.getElementById('searchInput');
  const dim = document.getElementById('dim');
  const dropdown = document.getElementById('dropdown');
  const iconClear = document.getElementById('iconClear');
  const suggList = document.getElementById('suggList');
  const closeBtn = document.getElementById('closeBtn');

  // 검색 추천 데이터
  const SUGGESTIONS = [
    '안국약품', '안전', '안전 관리자', '안랩', '(주)안랩',
    '한국산업안전보건공단', '네트워크/보안/운영', '비서/안내/수행원',
    '카카오', '네이버', '토스', '프로덕트 디자이너', '개발자 평균 연봉',
    'UX 디자이너', '스타트업 채용', '재택근무 기업'
  ];

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  // 입력한 글자를 메인 그린으로 하이라이트 (모든 일치 구간)
  function highlight(text, q) {
    const safe = escapeHtml(text);
    if (!q) return safe;
    const eq = escapeHtml(q);
    const re = new RegExp('(' + eq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<span class="hl">$1</span>');
  }

  const SEARCH_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';

  function renderSuggestions(q) {
    const query = (q || '').trim();
    const list = (query
      ? SUGGESTIONS.filter(s => s.toLowerCase().includes(query.toLowerCase()))
      : SUGGESTIONS).slice(0, 10);   // 최대 10건만 노출
    if (!list.length) {
      suggList.innerHTML = '<div class="sugg-empty">검색 결과가 없습니다</div>';
      return;
    }
    suggList.innerHTML = list.map(s =>
      '<div class="sugg-row" data-value="' + escapeHtml(s) + '">' +
        SEARCH_SVG +
        '<span class="label">' + highlight(s, query) + '</span>' +
      '</div>'
    ).join('');
  }

  // 확장 폭(CSS --search-w)과 동일한 값 사용 → 항상 동기화
  const SEARCH_W = parseInt(getComputedStyle(document.documentElement)
                    .getPropertyValue('--search-w'), 10) || 620;

  function centerSearch() {
    // 검색바는 flex-end 기준 우측 고정 → 확장 후 우측 끝은 그대로, 폭만 좌측으로 늘어남
    const r = search.getBoundingClientRect();           // 현재(접힘) 우측 끝
    const expandedCenter = r.right - SEARCH_W / 2;       // 확장 후 중심
    const dx = (document.documentElement.clientWidth / 2) - expandedCenter;
    search.style.transform = 'translateX(' + dx + 'px)';
  }

  function open() {
    centerSearch();
    renderSuggestions(input.value);
    wrap.classList.add('active');
    dim.classList.add('active');
    input.focus();
  }
  function close() {
    search.style.transform = '';
    wrap.classList.remove('active');
    dim.classList.remove('active');
    input.blur();
  }

  // 창 크기 변경 시 열려 있으면 중앙 재계산
  window.addEventListener('resize', () => {
    if (wrap.classList.contains('active')) centerSearch();
  });

  search.addEventListener('click', open);
  dim.addEventListener('click', close);

  // 입력 시 clear 버튼 토글 + 추천 리스트 갱신(그린 하이라이트)
  input.addEventListener('input', () => {
    iconClear.style.display = input.value ? 'block' : 'none';
    renderSuggestions(input.value);
  });
  iconClear.addEventListener('click', (e) => {
    e.stopPropagation();
    input.value = '';
    iconClear.style.display = 'none';
    renderSuggestions('');
    input.focus();
  });

  // ESC 닫기
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
  });

  // 닫기 버튼
  closeBtn.addEventListener('click', close);

  // 프로필 클릭 → 비로그인 상태로 전환 (로그인 클릭 시 복귀)
  document.getElementById('profileBtn').addEventListener('click', () => {
    wrap.classList.add('logged-out');
  });
  document.getElementById('loginBtn').addEventListener('click', () => {
    wrap.classList.remove('logged-out');
  });

  // 추천 항목 클릭 → 입력창 채우기
  suggList.addEventListener('click', (e) => {
    const row = e.target.closest('.sugg-row');
    if (!row) return;
    input.value = row.getAttribute('data-value');
    iconClear.style.display = 'block';
    renderSuggestions(input.value);
    input.focus();
  });

  // 헤더 내부 클릭은 닫힘 방지
  wrap.addEventListener('click', (e) => e.stopPropagation());
</script>

</body>
</html>
