<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · 비밀번호 안내 문구</title>
<style>
:root{
  --green:#00C274; --green-700:#00A862;
  --red:#E5484D;
  --tx:#242628; --tx2:#4B4E52; --tx3:#686a6d; --ph:#b1b3b8;
  --ln:#e5e6e9; --bg:#f3f3f4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  background:var(--bg); color:var(--tx); -webkit-font-smoothing:antialiased;
  padding:60px 20px 80px;
}
.wrap{width:360px;margin:0 auto}

/* 로고 · 안내 */
.logo{text-align:center}
.logo img{width:140px;height:auto;display:inline-block}
.lead{margin-top:22px;text-align:center;font-size:13px;line-height:22px;color:var(--tx3)}

/* 탭 */
.tabs{display:flex;gap:8px;margin-top:28px;background:#fafafa;border-radius:12px 12px 0 0;overflow:hidden}
.tab{
  flex:1;height:48px;border:0;background:transparent;font:inherit;font-size:14px;font-weight:700;
  color:var(--ph);cursor:pointer;border-radius:10px;transition:.15s
}
.tab.on{background:#fff;color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx)}

/* 카드 */
.card{background:#fff;border-radius:0 0 12px 12px}
.card h2{padding:30px 32px 0;font-size:18px;font-weight:700;letter-spacing:-.3px}
.form{padding:22px 32px 26px}

.btn{
  width:100%;height:44px;border:0;border-radius:8px;font:inherit;font-size:14px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s
}
.btn.kakao{background:#FEE500;color:#191919}
.btn.kakao:hover{background:#f2da00}
.btn.email{background:var(--green);color:#fff;margin-top:6px}
.btn.email:hover{background:var(--green-700)}
.btn svg{flex:none}

.divider{height:1px;background:var(--ln);margin:24px 0}

.field{margin-bottom:14px}
.ipt{
  display:flex;align-items:center;height:44px;padding:0 16px;background:#fff;
  border:1px solid var(--ln);border-radius:8px;transition:border-color .12s
}
.ipt input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--tx)}
.ipt input::placeholder{color:var(--ph)}
.ipt.err{border-color:var(--red)}
.ipt.ok{border-color:var(--green)}
.msg{margin-top:8px;font-size:12px;line-height:17px;letter-spacing:-.2px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}

.foot{
  border-top:1px solid var(--ln);padding:22px 32px;
  display:flex;align-items:center;justify-content:center;gap:14px;font-size:13px;color:var(--tx2)
}
.foot a{color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:2px}

.done{
  display:none;margin-top:16px;padding:12px 14px;background:#f2fbf7;border-radius:8px;
  font-size:13px;font-weight:600;color:var(--green-700);text-align:center
}
.done.on{display:block}
</style>
</head>
<body>
<div class="wrap">

  <div class="logo"><img src="jobplanet-wordmark.png" alt="Jobplanet"></div>
  <p class="lead">잡플래닛은 회원님의 익명성을 보장하기 위해<br>어떠한 개인정보도 노출하지 않습니다.</p>

  <div class="tabs">
    <button class="tab on" data-tab="personal">개인회원</button>
    <button class="tab" data-tab="company">기업회원</button>
  </div>

  <div class="card">
    <h2>회원가입</h2>
    <div class="form">

      <button class="btn kakao" type="button">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2l-1.1 4c-.1.4.3.6.6.4l4.7-3.1c.2 0 .5 0 .7 0 5.1 0 9.2-3.3 9.2-7.4S17.1 3 12 3z"/></svg>
        카카오로 시작하기
      </button>

      <div class="divider"></div>

      <div class="field">
        <div class="ipt" id="wEmail"><input type="text" id="iEmail" placeholder="이메일 주소" autocomplete="off"></div>
      </div>

      <div class="field">
        <div class="ipt" id="wPw"><input type="password" id="iPw" placeholder="비밀번호 (영문/숫자/특수문자 포함)" autocomplete="new-password"></div>
        <div class="msg" id="mPw"></div>
      </div>

      <div class="field">
        <div class="ipt" id="wPw2"><input type="password" id="iPw2" placeholder="비밀번호 재입력" autocomplete="new-password"></div>
        <div class="msg" id="mPw2"></div>
      </div>

      <button class="btn email" type="button" id="btnSubmit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.3l-10 5.9-10-5.9V6a1 1 0 0 1 1-1zm-1 3.6V18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V8.6l-9.5 5.6a1 1 0 0 1-1 0L2 8.6z"/></svg>
        이메일로 가입하기
      </button>

      <div class="done" id="done">가입 조건을 모두 충족했어요</div>
    </div>

    <div class="foot">
      <span>이미 회원이세요?</span><a href="#">로그인</a>
    </div>
  </div>

</div>

<script>
const MIN = 8;
const COPY = {
  pwEmpty:'비밀번호를 입력해 주세요.',
  pwInvalid:'영문, 숫자, 특수문자를 포함해 8자 이상 입력해 주세요.',
  pwOk:'사용할 수 있는 비밀번호예요',
  pw2Empty:'비밀번호를 한 번 더 입력해 주세요.',
  pw2Mismatch:'비밀번호가 일치하지 않습니다',
  pw2Ok:'비밀번호가 일치해요'
};

const S = { touched:{pw:false,pw2:false}, focus:null, submitted:false };

const $ = id => document.getElementById(id);
const iPw = $('iPw'), iPw2 = $('iPw2');

/* 영문 + 숫자 + 특수문자 모두 포함하고 8자 이상 */
function isValid(v){
  return v.length >= MIN
    && /[a-zA-Z]/.test(v)
    && /[0-9]/.test(v)
    && /[!-\/:-@\[-`{-~]/.test(v);
}

function paint(wrapId, msgId, state, text){
  const w = $(wrapId), m = $(msgId);
  w.classList.toggle('err', state==='err');
  w.classList.toggle('ok',  state==='ok');
  m.className = 'msg' + (state==='none' ? '' : ' ' + state);
  m.textContent = state==='none' ? '' : text;
}

function render(){
  const pw = iPw.value, pw2 = iPw2.value;

  /* 비밀번호
     - 조건 미충족: 포커스 아웃 이후(또는 제출 후) 빨간 문구
     - 조건 충족: 포커스 중일 때만 초록 문구, 포커스가 빠지면 기본 상태 */
  if(!pw){
    if(S.submitted) paint('wPw','mPw','err',COPY.pwEmpty);
    else paint('wPw','mPw','none');
  } else if(!isValid(pw)){
    if(S.touched.pw || S.submitted) paint('wPw','mPw','err',COPY.pwInvalid);
    else paint('wPw','mPw','none');
  } else {
    if(S.focus==='pw') paint('wPw','mPw','ok',COPY.pwOk);
    else paint('wPw','mPw','none');
  }

  /* 비밀번호 재입력
     - 불일치: 본란 길이만큼 쳤거나 포커스 아웃 이후 빨간 문구
     - 일치: 포커스 중일 때만 초록 문구 */
  if(!pw2){
    if(S.submitted) paint('wPw2','mPw2','err',COPY.pw2Empty);
    else paint('wPw2','mPw2','none');
  } else if(pw2 !== pw){
    if(pw2.length >= pw.length || S.touched.pw2 || S.submitted) paint('wPw2','mPw2','err',COPY.pw2Mismatch);
    else paint('wPw2','mPw2','none');
  } else {
    if(S.focus==='pw2') paint('wPw2','mPw2','ok',COPY.pw2Ok);
    else paint('wPw2','mPw2','none');
  }

  $('done').classList.toggle('on', S.submitted && isValid(pw) && pw2===pw);
}

[['pw',iPw],['pw2',iPw2]].forEach(([key,el])=>{
  el.addEventListener('input', render);
  el.addEventListener('focus', ()=>{ S.focus=key; render(); });
  el.addEventListener('blur',  ()=>{ S.touched[key]=true; S.focus=null; render(); });
});

$('btnSubmit').onclick = ()=>{
  S.submitted = true;
  S.touched = {pw:true, pw2:true};
  render();
  const first = document.querySelector('.ipt.err input');
  if(first) first.focus();
};

document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  };
});

render();
</script>
</body>
</html>
