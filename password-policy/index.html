<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회원가입 · 비밀번호 안내 문구</title>
<style>
:root{
  --green:#00C274; --green-700:#00A862; --login:#00C362;
  --red:#E5484D;
  --g900:#242628; --g700:#323438; --g500:#686A6D; --g300:#A4A6AD; --g200:#C5C7CC; --g100:#E5E6E9;
  --bg:#F3F3F4;
  --sd:0 1px 4px rgba(30,40,58,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  background:var(--bg); color:var(--g700); -webkit-font-smoothing:antialiased;
  padding:70px 20px 80px;
}
.wrap{width:360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* 로고 · 안내 · 탭 : 카드 위 영역 (gap 30) */
.top{display:flex;flex-direction:column;align-items:center;gap:30px}
.brand{display:flex;flex-direction:column;align-items:center;gap:20px;width:248px}
.brand img{width:142px;height:34px;display:block}
.lead{text-align:center;font-size:14px;font-weight:400;line-height:22px;color:var(--g500)}

/* 탭 바 : 카드와 분리된 흰색 박스 */
.tabs{display:flex;width:360px;height:52px;background:#fff;border-radius:12px;box-shadow:var(--sd)}
.tab{
  flex:1;height:52px;border:0;background:transparent;font:inherit;
  font-size:16px;font-weight:600;line-height:24px;color:var(--g300);
  cursor:pointer;border-radius:12px;transition:.15s
}
.tab.on{background:#fff;color:var(--g700);box-shadow:inset 0 0 0 1px var(--g700)}

/* 카드 */
.card{width:360px;background:#fff;border-radius:12px;box-shadow:var(--sd);padding:28px 0;display:flex;flex-direction:column;gap:20px}
.card h2{padding:0 32px;font-size:20px;font-weight:700;line-height:28px;color:var(--g700)}
.body{display:flex;flex-direction:column;align-items:center;gap:24px}
.form{width:296px;display:flex;flex-direction:column;gap:20px}

.btn{
  width:100%;height:48px;border:0;border-radius:10px;font:inherit;
  font-size:16px;font-weight:600;line-height:24px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s
}
.btn.kakao{background:#FEE500;color:var(--g900)}
.btn.kakao:hover{background:#f2da00}
.btn.email{background:var(--green);color:#fff}
.btn.email:hover{background:var(--green-700)}
.btn svg{flex:none}

.hr{height:1px;background:var(--g100)}
.hr.full{width:100%}

.fields{display:flex;flex-direction:column;gap:10px}
.group{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.ipt{
  display:flex;align-items:center;padding:12px 12px 12px 16px;background:#fff;
  border-radius:8px;box-shadow:inset 0 0 0 1px var(--g100);transition:box-shadow .12s
}
.ipt input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;font-weight:400;line-height:24px;color:var(--g900)}
.ipt input::placeholder{color:var(--g200)}
.ipt.err{box-shadow:inset 0 0 0 1px var(--red)}
.ipt.ok{box-shadow:inset 0 0 0 1px var(--green)}
.msg:empty{display:none}
.msg{font-size:12px;font-weight:400;line-height:18px;letter-spacing:-.2px}
.msg.err{color:var(--red)}
.msg.ok{color:var(--green)}

.foot{display:flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:400;line-height:22px;color:var(--g700)}
.foot a{color:var(--login);font-weight:600;text-decoration:underline;text-underline-offset:2px}

.done{
  width:296px;margin:-4px auto 0;padding:12px 14px;background:#f2fbf7;border-radius:8px;
  font-size:14px;font-weight:600;line-height:22px;color:var(--green-700);text-align:center;display:none
}
.done.on{display:block}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <img src="jobplanet-wordmark.png" alt="Jobplanet">
      <p class="lead">잡플래닛은 회원님의 익명성을 보장하기 위해<br>어떠한 개인정보도 노출하지 않습니다.</p>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="personal">개인회원</button>
      <button class="tab" data-tab="company">기업회원</button>
    </div>
  </div>

  <div class="card">
    <h2>회원가입</h2>
    <div class="body">
      <div class="form">

        <button class="btn kakao" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2l-1.1 4c-.1.4.3.6.6.4l4.7-3.1c.2 0 .5 0 .7 0 5.1 0 9.2-3.3 9.2-7.4S17.1 3 12 3z"/></svg>
          카카오로 시작하기
        </button>

        <div class="hr"></div>

        <div class="group">
          <div class="fields">
            <div class="field">
              <div class="ipt" id="wEmail"><input type="text" id="iEmail" placeholder="이메일 주소" autocomplete="off"></div>
            </div>
            <div class="field">
              <div class="ipt" id="wPw"><input type="password" id="iPw" placeholder="비밀번호 (영문/숫자/특수문자 포함)" autocomplete="new-password"></div>
              <div class="msg" id="mPw"></div>
            </div>
            <div class="field">
              <div class="ipt" id="wPw2"><input type="password" id="iPw2" placeholder="비밀번호 재입력" autocomplete="new-password"></div>
              <div class="msg" id="mPw2"></div>
            </div>
          </div>

          <button class="btn email" type="button" id="btnSubmit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18a1 1 0 0 1 1 1v.3l-10 5.9-10-5.9V6a1 1 0 0 1 1-1zm-1 3.6V18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V8.6l-9.5 5.6a1 1 0 0 1-1 0L2 8.6z"/></svg>
            이메일로 가입하기
          </button>
        </div>
      </div>

      <div class="done" id="done">가입 조건을 모두 충족했어요</div>

      <div class="hr full"></div>

      <div class="foot"><span>이미 회원이세요?</span><a href="#">로그인</a></div>
    </div>
  </div>

</div>

<script>
const MIN = 8;
const COPY = {
  pwEmpty:'비밀번호를 입력해 주세요.',
  pwInvalid:'영문, 숫자, 특수문자를 포함해 8자 이상 입력해 주세요.',
  pwOk:'사용할 수 있는 비밀번호예요',
  pw2Empty:'비밀번호를 한 번 더 입력해 주세요.',
  pw2Mismatch:'비밀번호가 일치하지 않습니다',
  pw2Ok:'비밀번호가 일치해요'
};

const S = { touched:{pw:false,pw2:false}, focus:null, submitted:false };

const $ = id => document.getElementById(id);
const iPw = $('iPw'), iPw2 = $('iPw2');

/* 영문 + 숫자 + 특수문자 모두 포함하고 8자 이상 */
function isValid(v){
  return v.length >= MIN
    && /[a-zA-Z]/.test(v)
    && /[0-9]/.test(v)
    && /[!-\/:-@\[-`{-~]/.test(v);
}

function paint(wrapId, msgId, state, text){
  const w = $(wrapId), m = $(msgId);
  w.classList.toggle('err', state==='err');
  w.classList.toggle('ok',  state==='ok');
  m.className = 'msg' + (state==='none' ? '' : ' ' + state);
  m.textContent = state==='none' ? '' : text;
}

function render(){
  const pw = iPw.value, pw2 = iPw2.value;

  /* 비밀번호
     - 조건 미충족: 포커스 아웃 이후(또는 제출 후) 빨간 문구
     - 조건 충족: 포커스 중일 때만 초록 문구, 포커스가 빠지면 기본 상태 */
  if(!pw){
    if(S.submitted) paint('wPw','mPw','err',COPY.pwEmpty);
    else paint('wPw','mPw','none');
  } else if(!isValid(pw)){
    if(S.touched.pw || S.submitted) paint('wPw','mPw','err',COPY.pwInvalid);
    else paint('wPw','mPw','none');
  } else {
    if(S.focus==='pw') paint('wPw','mPw','ok',COPY.pwOk);
    else paint('wPw','mPw','none');
  }

  /* 비밀번호 재입력
     - 불일치: 본란 길이만큼 쳤거나 포커스 아웃 이후 빨간 문구
     - 일치: 포커스 중일 때만 초록 문구 */
  if(!pw2){
    if(S.submitted) paint('wPw2','mPw2','err',COPY.pw2Empty);
    else paint('wPw2','mPw2','none');
  } else if(pw2 !== pw){
    if(pw2.length >= pw.length || S.touched.pw2 || S.submitted) paint('wPw2','mPw2','err',COPY.pw2Mismatch);
    else paint('wPw2','mPw2','none');
  } else {
    if(S.focus==='pw2') paint('wPw2','mPw2','ok',COPY.pw2Ok);
    else paint('wPw2','mPw2','none');
  }

  $('done').classList.toggle('on', S.submitted && isValid(pw) && pw2===pw);
}

[['pw',iPw],['pw2',iPw2]].forEach(([key,el])=>{
  el.addEventListener('input', render);
  el.addEventListener('focus', ()=>{ S.focus=key; render(); });
  el.addEventListener('blur',  ()=>{ S.touched[key]=true; S.focus=null; render(); });
});

$('btnSubmit').onclick = ()=>{
  S.submitted = true;
  S.touched = {pw:true, pw2:true};
  render();
  const first = document.querySelector('.ipt.err input');
  if(first) first.focus();
};

document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  };
});

render();
</script>
</body>
</html>
