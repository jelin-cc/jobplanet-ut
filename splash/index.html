<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Jobplanet — Splash</title>
<style>
  :root{
    --brand:#00C274;
    --bg:#ffffff;
    --frame-w:393px;
    --frame-h:852px;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:#0e0f12;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Helvetica Neue",sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }

  .frame{
    position:relative;
    width:var(--frame-w);
    height:var(--frame-h);
    background:var(--bg);
    overflow:hidden;
    cursor:pointer;
  }

  @media (max-width:420px){
    html,body{background:var(--bg);}
    .frame{width:100vw;height:100vh;}
  }

  .stage{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
  }

  /* 퇴장(전체 확대+페이드)을 담당하는 래퍼 */
  .logo-wrap{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    will-change:transform,opacity;
    animation:exit 3.6s cubic-bezier(.22,.61,.36,1) infinite;
  }

  .logo{
    width:232px;
    height:auto;
    display:block;
    overflow:visible;
  }

  /* 심볼: 회전 스윕 인 (자기 중심 기준) */
  .sym{
    transform-box:fill-box;
    transform-origin:center;
    will-change:transform,opacity;
    animation:symIn 3.6s cubic-bezier(.22,.61,.36,1) infinite;
  }

  /* 워드마크: 살짝 늦게 왼→오른쪽으로 밀려나며 페이드 인 */
  .word{
    transform-box:fill-box;
    transform-origin:left center;
    will-change:transform,opacity;
    animation:wordIn 3.6s cubic-bezier(.22,.61,.36,1) infinite;
  }

  /* 심볼 뒤 은은한 그린 글로우 펄스 */
  .pulse{
    position:absolute;
    left:18%;top:50%;
    width:150px;height:150px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,194,116,.12) 0%, rgba(0,194,116,0) 62%);
    opacity:0;
    animation:pulseCycle 3.6s ease-out infinite;
    pointer-events:none;
  }

  @keyframes symIn{
    0%   { opacity:0; transform:rotate(-14deg) scale(.88); }
    18%  { opacity:1; transform:rotate(0deg)   scale(1); }
    100% { opacity:1; transform:rotate(0deg)   scale(1); }
  }

  @keyframes wordIn{
    0%,8% { opacity:0; transform:translateX(-16px); }
    26%   { opacity:1; transform:translateX(0); }
    100%  { opacity:1; transform:translateX(0); }
  }

  @keyframes exit{
    0%,64% { opacity:1; transform:scale(1); }
    80%    { opacity:0; transform:scale(1.05); }
    100%   { opacity:0; transform:scale(1.05); }
  }

  @keyframes pulseCycle{
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.7); }
    20%  { opacity:1; transform:translate(-50%,-50%) scale(1); }
    55%  { opacity:.6; transform:translate(-50%,-50%) scale(1.05); }
    72%  { opacity:0; transform:translate(-50%,-50%) scale(1.25); }
    100% { opacity:0; transform:translate(-50%,-50%) scale(1.25); }
  }

  .hint{
    position:absolute;left:0;right:0;bottom:34px;
    text-align:center;
    font-size:12px;letter-spacing:.2px;
    color:rgba(0,0,0,.28);
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .hint.gone{opacity:0;}

  .replay .sym,.replay .word,.replay .logo-wrap,.replay .pulse{animation:none;}
</style>
</head>
<body>
  <div class="frame" id="frame" title="탭하면 처음부터 다시 재생">
    <div class="stage">
      <div class="pulse"></div>
      <div class="logo-wrap">
        <svg class="logo" viewBox="0 0 619 114" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="잡플래닛">

            <path d="M337,30c-6.28,0-12.12,1.87-17,5.08v-5.08h-14v84h14v-27.08c4.88,3.21,10.72,5.08,17,5.08,17.12,0,31-13.88,31-31s-13.88-31-31-31ZM337,79c-9.93,0-18-8.08-18-18s8.07-18,18-18,18,8.08,18,18-8.07,18-18,18Z"/>
          </g>
          <!-- 심볼 -->
          <g class="sym" fill="#00C274">
            <path d="M20.43,82.94c-2.81,0-5.58-.14-8.31-.42,9.16,10.7,22.74,17.48,37.91,17.48,27.59,0,49.96-22.42,49.96-50.07,0-6.86-1.38-13.4-3.87-19.35-11.58,30.6-41.09,52.36-75.69,52.36Z"/>
            <path d="M71.87,50.47c5.51-4.66,13.96-13.03,20.97-26.37-1.98-3.3-10.49-16.57-27.98-21.99-2.66-.83-19.3-5.7-36.9,2.99-3.06,1.51-12.08,6.36-19.08,16.62C.6,33.85-2.6,50.26,2.35,59.07c1.97,3.51,4.88,5.79,4.88,5.79,4.09,3.21,8.49,3.78,10.45,4.03,5.39.7,30.61,1.54,54.19-18.42Z"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="hint" id="hint">탭하면 다시 재생</div>
  </div>

<script>
  const frame = document.getElementById('frame');
  const hint  = document.getElementById('hint');

  frame.addEventListener('click', () => {
    frame.classList.add('replay');
    void frame.offsetWidth;
    frame.classList.remove('replay');
  });

  setTimeout(() => hint.classList.add('gone'), 5000);
</script>
</body>
</html>
