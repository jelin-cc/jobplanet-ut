<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Jobplanet — Splash</title>
<style>
  :root{
    --brand:#00C274;
    --bg:#ffffff;
    --frame-w:393px;
    --frame-h:852px;
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:#0e0f12;            /* 프레임 밖 여백 (공유 시 기기 무드) */
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Helvetica Neue",sans-serif;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }

  /* 393x852 디바이스 프레임 */
  .frame{
    position:relative;
    width:var(--frame-w);
    height:var(--frame-h);
    background:var(--bg);
    overflow:hidden;
    cursor:pointer;
  }

  /* 화면을 꽉 채워야 할 때(모바일 단독 뷰)는 프레임을 100%로 */
  @media (max-width:420px){
    html,body{background:var(--bg);}
    .frame{width:100vw;height:100vh;}
  }

  /* ===== 스플래시 스테이지 ===== */
  .stage{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg);
  }

  .logo{
    width:188px;
    height:auto;
    transform-origin:center;
    opacity:0;
    will-change:transform,opacity;
    /* 진입 → 정지 → 퇴장 을 하나의 키프레임 사이클로 (무한 반복) */
    animation:logoCycle 3.6s cubic-bezier(.22,.61,.36,1) infinite;
  }

  /* 로고 아래로 은은하게 깔리는 워드/그로스 라인 (옵션 디테일) */
  .pulse{
    position:absolute;
    width:188px;height:188px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,194,116,.10) 0%, rgba(0,194,116,0) 60%);
    opacity:0;
    animation:pulseCycle 3.6s ease-out infinite;
  }

  @keyframes logoCycle{
    /* 진입: 살짝 작게+아래에서 위로 떠오르며 페이드 인 */
    0%   { opacity:0; transform:scale(.94) translateY(8px); filter:blur(2px); }
    16%  { opacity:1; transform:scale(1)   translateY(0);   filter:blur(0); }
    /* 정지 (브랜드 인지 구간) */
    62%  { opacity:1; transform:scale(1)   translateY(0);   filter:blur(0); }
    /* 퇴장: 살짝 확대되며 페이드 아웃 (앱 진입 느낌) */
    80%  { opacity:0; transform:scale(1.06) translateY(-2px); filter:blur(0); }
    100% { opacity:0; transform:scale(1.06) translateY(-2px); }
  }

  @keyframes pulseCycle{
    0%   { opacity:0; transform:scale(.7); }
    18%  { opacity:1; transform:scale(1); }
    55%  { opacity:.6; transform:scale(1.04); }
    78%  { opacity:0; transform:scale(1.25); }
    100% { opacity:0; }
  }

  /* 재생 안내(공유용) — 5초 후 자동 숨김 */
  .hint{
    position:absolute;left:0;right:0;bottom:34px;
    text-align:center;
    font-size:12px;letter-spacing:.2px;
    color:rgba(0,0,0,.28);
    transition:opacity .4s ease;
    pointer-events:none;
  }
  .hint.gone{opacity:0;}

  /* 클릭 시 즉시 리플레이를 위한 reset 트릭 */
  .replay .logo{animation:none;}
  .replay .pulse{animation:none;}
</style>
</head>
<body>

      </svg>
    </div>
    <div class="hint" id="hint">탭하면 다시 재생</div>
  </div>

<script>
  const frame = document.getElementById('frame');
  const hint  = document.getElementById('hint');

  // 탭하면 애니메이션 처음부터 리플레이
  frame.addEventListener('click', () => {
    frame.classList.add('replay');
    // 리플로우 강제 → 애니메이션 재시작
    void frame.offsetWidth;
    frame.classList.remove('replay');
  });

  // 진입 후 5초 뒤 안내 문구 페이드아웃
  setTimeout(() => hint.classList.add('gone'), 5000);
</script>
</body>
</html>
