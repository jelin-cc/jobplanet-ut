<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, initial-scale=1.0" />
<title>Jobplanet Home PC</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{
    --green-500:#00C274; --green-600:#00A866; --green-50:#E3F8ED;
    --g900:#242628; --g800:#323438; --g700:#4B4C50; --g600:#57595B; --g500:#686A6D;
    --g400:#85878C; --g300:#A4A6AD; --g200:#C5C7CC; --g100:#E5E6E9; --g50:#F3F3F4; --g30:#F9F9FB;
    --red-400:#EF5350; --red-50:#FFF0F2; --red-100:#FFCDCD;
    --yellow-50:#FAF9EC; --yellow-600:#D79304;
    --blue-50:#ECF6FE; --blue-600:#1E88E5;
    --orange-50:#FFF3E0; --orange-500:#FF9800; --orange-600:#FB8C00;
    --jk:#083CCC; --jk-line:#96B1FD;
    --ease:cubic-bezier(.4,0,.2,1);
    --search-w:620px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{font-family:'Pretendard',system-ui,sans-serif; background:#fff; color:var(--g900);
       min-width:1280px; overflow-x:auto;}
  img{display:block;}
  .wrap{width:1184px; margin:0 auto;}

  /* ===================== HEADER ===================== */
  .header-wrap{position:sticky; top:0; z-index:100; background:#fff;}
  .header{height:56px; background:#fff; display:flex; justify-content:center; align-items:center;}
  .header-inner{width:1200px; height:100%; display:flex; justify-content:space-between; align-items:center;}
  .header-divider{height:1px; background:var(--g100);}

  .gnb{display:flex; align-items:flex-end; gap:34px;}
  .logo{display:flex; align-items:center; flex-shrink:0;}
  .logo img{height:24px;}
  .gnb-menus{display:flex; align-items:center; gap:34px; overflow:hidden; white-space:nowrap;
             transition:opacity .22s var(--ease), width .28s var(--ease), margin .28s var(--ease), transform .28s var(--ease);
             transform-origin:left center;}
  .gnb-menu{color:var(--g800); font-size:15px; font-weight:600; line-height:24px; cursor:pointer;}

  .header-right{display:flex; justify-content:flex-end; align-items:center; gap:24px;}

  /* compact header search — 스크롤 시 노출, 클릭 시 확장 */
  .header-search{width:220px; height:40px; padding:11px 16px; background:var(--g50); border-radius:999px;
                 display:flex; align-items:center; gap:4px; cursor:text; flex-shrink:0;
                 opacity:0; transform:translateY(-10px); pointer-events:none;
                 transition:width .26s var(--ease), transform .34s var(--ease), opacity .34s var(--ease), background .2s var(--ease);}
  .header-wrap.scrolled .header-search{opacity:1; transform:translateY(0); pointer-events:auto;}
  .header-search:hover{background:#ededee;}
  .header-search input{flex:1; min-width:0; border:none; background:transparent; outline:none;
                       font-family:inherit; font-size:14px; color:var(--g900); caret-color:var(--green-500);}
  .header-search input::placeholder{color:var(--g300);}
  .header-search .hs-ic{width:16px; height:16px; color:var(--g300); flex-shrink:0;}
  .header-search .hs-clear{width:14px; height:14px; color:var(--g300); cursor:pointer; display:none; flex-shrink:0;}

  .right-icons{display:flex; align-items:center; gap:16px;}
  .right-icons .ic{width:18px; height:18px; color:var(--g500); cursor:pointer;}
  .profile{display:flex; align-items:center; gap:4px; cursor:pointer;}
  .profile .avatar{width:32px; height:32px; padding:8px; background:var(--g30); border-radius:6px;
                   border:1px solid var(--g100); display:flex; justify-content:center; align-items:center; color:var(--g500);}
  .profile .chev{width:14px; height:14px; color:var(--g300);}

  /* expand active state */
  .header-wrap.active .gnb-menus{width:0; margin-left:-34px; opacity:0; transform:translateX(-12px); pointer-events:none;}
  .header-wrap.active .header-search{width:var(--search-w);}
  .header-wrap.active .right-icons{opacity:.0; pointer-events:none; transition:opacity .2s var(--ease);}

  /* dropdown */
  .search-dropdown{position:absolute; top:52px; left:50%; width:var(--search-w); background:#fff;
                   border:1px solid var(--g100); border-radius:16px; box-shadow:0 4px 16px rgba(0,0,0,.08);
                   overflow:hidden; opacity:0; transform:translateX(-50%) translateY(-8px); pointer-events:none;
                   transition:opacity .2s var(--ease), transform .2s var(--ease);}
  .header-wrap.active .search-dropdown{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .sugg-list{padding:8px 0;}
  .sugg-row{display:flex; align-items:center; gap:8px; height:42px; padding:9px 20px; cursor:pointer;}
  .sugg-row:hover{background:var(--g30);}
  .sugg-row .ic{width:16px; height:16px; color:var(--g300); flex-shrink:0;}
  .sugg-row .label{font-size:14px; font-weight:600; line-height:22px; color:var(--g900);}
  .sugg-row .label .hl{color:var(--green-500);}
  .sugg-footer{display:flex; justify-content:flex-end; padding:12px 20px; border-top:1px solid var(--g100);}
  .sugg-close{font-size:13px; font-weight:600; color:var(--g700); cursor:pointer;}
  .dim{position:fixed; inset:0; background:rgba(0,0,0,.32); opacity:0; pointer-events:none;
       transition:opacity .22s var(--ease); z-index:50;}
  .dim.active{opacity:1; pointer-events:auto;}

  /* ===================== HERO ===================== */
  .hero{background:linear-gradient(180deg, rgba(227,248,237,.85) 0px, rgba(242,251,247,.80) 96px, #FFFFFF 188px);
        display:flex; flex-direction:column; align-items:center; padding:84px 0 64px;}
  .hero-title{font-size:32px; font-weight:700; line-height:44px; color:var(--g900); text-align:center; margin-bottom:28px;}
  .hero-title .accent{color:var(--green-500);}
  .hero-search{width:672px; height:56px; padding:0 18px 0 24px; border-radius:999px;
               border:2px solid transparent;
               background:linear-gradient(#fff,#fff) padding-box, linear-gradient(90deg,#00C274 0%,#5B9BF5 68%,#9B7AFF 100%) border-box;
               box-shadow:0 0 24px rgba(184,235,208,.5);
               display:flex; align-items:center; gap:4px;}
  .hero-search input{flex:1; border:none; outline:none; background:transparent; font-family:inherit;
                     font-size:15px; color:var(--g900);}
  .hero-search input::placeholder{color:var(--g400);}
  .hero-search .s-ic{width:20px; height:20px; color:var(--g400);}

  /* ranking ticker */
  .ticker{width:480px; margin-top:28px; display:flex; align-items:center; gap:8px;}
  .ticker .live{display:flex; align-items:center; gap:6px;}
  .ticker .dot{width:5px; height:5px; border-radius:999px; background:var(--green-500);}
  .ticker .live-tx{color:var(--g400); font-size:13px; font-weight:600;}
  .ticker .vbar{width:1px; height:12px; background:var(--g100);}
  .ticker .body{flex:1; display:flex; justify-content:space-between; align-items:center;}
  .ticker .rk{display:flex; align-items:center; gap:8px;}
  .ticker .rnum{color:var(--green-500); font-size:14px; font-weight:600;}
  .ticker .rname{color:#000; font-size:14px; font-weight:600;}
  .ticker .new{height:20px; padding:2px 6px; background:var(--green-50); border-radius:4px;
               color:var(--green-600); font-size:11px; font-weight:600;}
  .ticker .delta{display:flex; align-items:center; gap:2px; color:var(--red-400); font-size:13px; font-weight:600;}
  .ticker .chev{width:24px; height:24px; padding:4px; background:#fff; border:1px solid var(--g50); border-radius:6px; color:var(--g600);
                display:flex; align-items:center; justify-content:center;}

  /* quick menu */
  .quick{display:flex; gap:60px; margin-top:72px;}
  .qitem{width:72px; display:flex; flex-direction:column; align-items:center; gap:8px; position:relative; cursor:pointer;}
  .qicon{width:60px; height:60px; border-radius:16px; background:var(--g30); display:flex; align-items:center; justify-content:center;}
  .qicon img{width:30px; height:30px; object-fit:contain;}
  .qlabel{text-align:center; color:var(--g800); font-size:14px; font-weight:600; line-height:22px;}
  .qbadge{position:absolute; left:50px; top:0; width:16px; height:16px; border-radius:8px; background:#F44336;
          border:2px solid #fff; color:#fff; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center;}

  /* ===================== CONTENT ===================== */
  .content{padding:72px 0 120px; display:flex; flex-direction:column; gap:73px;}
  .mhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .mtitle{display:flex; align-items:center; gap:8px; font-size:22px; font-weight:700; line-height:30px; color:var(--g900);}
  .mtitle .micon{width:24px; height:24px; object-fit:contain;}
  .mtitle .orange{color:var(--orange-500);}
  .more{display:flex; align-items:center; gap:6px; color:var(--g400); font-size:16px; font-weight:600; cursor:pointer;}
  .more svg{width:18px; height:18px;}

  .row{display:flex; gap:16px; align-items:stretch; position:relative;}

  /* deadline banner */
  .dl-banner{height:52px; padding:0 16px; background:var(--red-50); border:1px solid var(--red-100); border-radius:12px;
             display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .dl-banner .dday{height:24px; padding:4px 10px; background:#fff; border-radius:999px; color:var(--red-400);
                   font-size:12px; font-weight:600; display:flex; align-items:center;}
  .dl-banner .dl-tx{flex:1; color:var(--red-400); font-size:14px; font-weight:600;}
  .dl-banner .dl-chev{color:var(--g400); display:flex;}

  /* job card */
  .jcard{flex:1; min-width:0; background:#fff; border:1px solid var(--g100); border-radius:12px;
         padding:16px 20px 20px; display:flex; flex-direction:column;}
  .jc-top{display:flex; align-items:center; gap:8px;}
  .jc-co{flex:1; min-width:0; display:flex; align-items:center; gap:6px;}
  .jc-logo{width:32px; height:32px; border-radius:8px; border:1px solid var(--g100); background:#fff;
           display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .jc-coname{color:var(--g500); font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .jc-bm{color:var(--g200); display:flex;}
  .jc-title{margin-top:6px; color:var(--g900); font-size:15px; font-weight:600; line-height:24px;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:48px;}
  .jc-meta{margin-top:4px; display:flex; align-items:center; gap:4px; font-size:12px;}
  .jc-dday{color:var(--red-400); font-weight:500;}
  .jc-dot{color:var(--g300); font-size:11px;}
  .jc-sub{color:var(--g300); font-weight:500;}
  .jc-bottom{margin-top:16px; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; min-height:32px;}
  .jc-tags{display:flex; gap:4px; flex-wrap:wrap;}
  .tag{height:20px; display:inline-flex; align-items:center; gap:2px; padding:2px 6px; border-radius:4px; font-size:11px; font-weight:600;}
  .tag.yellow{background:var(--yellow-50); color:var(--yellow-600);}
  .tag.green{background:var(--green-50); color:var(--green-600);}
  .tag.blue{background:var(--blue-50); color:var(--blue-600);}
  .jc-jk{height:32px; padding:0 10px; display:flex; align-items:center; background:#fff; border-radius:6px;
         border:1px solid var(--jk-line); color:var(--jk); font-size:13px; font-weight:600; white-space:nowrap;}

  /* carousel arrow */
  .arrow{position:absolute; right:-20px; top:50%; transform:translateY(-50%); width:40px; height:40px;
         background:#fff; border:1px solid var(--g100); border-radius:999px; display:flex; align-items:center; justify-content:center;
         box-shadow:0 4px 16px rgba(0,0,0,.08); color:var(--g800); cursor:pointer; z-index:2;}

  /* salary review card */
  .rcard{flex:1; min-width:0; padding:24px 24px 20px; background:linear-gradient(180deg,#FFF3E0 0%,#fff 100%);
         border:1px solid rgba(36,38,40,.10); border-radius:16px; display:flex; flex-direction:column; gap:16px;}
  .rc-quote{color:var(--g900); font-size:15px; font-weight:600; line-height:24px;}
  .rc-snip{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .rc-snip .rc-txt{flex:1; min-width:0; color:var(--g500); font-size:14px; line-height:22px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rc-detail{height:44px; display:flex; align-items:center; justify-content:center; gap:2px;
             background:#fff; border:1px solid var(--g100); border-radius:8px; color:var(--g700); font-size:12px; font-weight:600;}
  .rc-div{height:1px; background:var(--g50);}
  .rc-co{display:flex; align-items:center; gap:6px;}
  .rc-co .name{color:var(--g800); font-size:14px; font-weight:600;}

  /* AD banner */
  .ad-banner{height:90px; background:#fff; border:1px solid var(--g100); border-radius:12px; position:relative;
             display:flex; align-items:center; overflow:hidden;}
  .ad-banner .ad-left{flex:1; height:100%; display:flex; align-items:center; gap:20px; padding:0 28px;
                      background:linear-gradient(90deg,#EAF1FF,#F6F9FF);}
  .ad-banner .ad-illust{width:54px; height:54px; border-radius:10px; background:#D9E4FF; display:flex; align-items:center; justify-content:center;
                        color:#5B7BD8; font-size:11px; font-weight:700;}
  .ad-banner .ad-tx{font-size:24px; font-weight:800; color:#2A3A66; letter-spacing:-.5px;}
  .ad-banner .ad-cta{margin-right:140px; height:40px; padding:0 20px; background:#1A1A1E; color:#fff; border-radius:999px;
                     display:flex; align-items:center; font-size:15px; font-weight:600;}
  .ad-badge{position:absolute; right:12px; top:12px; height:20px; padding:2px 6px; border:1px solid var(--g100); border-radius:6px;
            display:flex; align-items:center; gap:1px; color:var(--g200); font-size:11px; font-weight:600;}

  /* theme card */
  .tcard{flex:1; min-width:0; border-radius:20px; overflow:hidden; border:1px solid rgba(36,38,40,.10);}
  .tc-img{height:142px; padding:16px; display:flex; align-items:flex-start;}
  .tc-pill{padding:4px 12px; background:rgba(0,0,0,.8); border-radius:999px; color:#fff; font-size:13px; font-weight:600;}
  .tc-body{padding:20px 20px 32px; background:#fff;}
  .tc-title{color:var(--g900); font-size:18px; font-weight:700; line-height:26px;}
  .tc-sub{color:var(--g400); font-size:15px; line-height:24px; margin-top:2px;}

  /* popular post */
  .pcard{flex:1; min-width:0; height:226px; padding:20px 20px 14px; background:#fff; border:1px solid var(--g100);
         border-radius:12px; display:flex; flex-direction:column; justify-content:space-between;}
  .pc-body{color:var(--g800); font-size:16px; line-height:24px; overflow:hidden;
           display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical;}
  .pc-foot{display:flex; align-items:center; gap:20px; color:var(--g300); font-size:14px;}
  .pc-foot .grp{display:flex; align-items:center; gap:12px;}
  .pc-foot .it{display:flex; align-items:center; gap:6px;}
  .pc-foot .view{flex:1; text-align:right;}
</style>
</head>
<body>

  <div class="dim" id="dim"></div>

  <!-- ===================== HEADER ===================== -->
  <div class="header-wrap" id="headerWrap">
    <div class="header">
      <div class="header-inner">
        <div class="gnb">
          <div class="logo"><img src="https://jelin-cc.github.io/jobplanet-ut/jobplanet-wordmark.png" alt="Jobplanet" /></div>
          <div class="gnb-menus">
            <span class="gnb-menu">리뷰 피드</span>
            <span class="gnb-menu">채용 공고</span>
            <span class="gnb-menu">잡플위키</span>
            <span class="gnb-menu">커뮤니티</span>
            <span class="gnb-menu">멤버십</span>
          </div>
        </div>

        <div class="header-right">
          <div class="header-search" id="headerSearch">
            <input type="text" id="hsInput" placeholder="기업, 공고 검색" autocomplete="off" />
            <svg class="hs-clear" id="hsClear" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="currentColor"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><line x1="15.5" y1="8.5" x2="8.5" y2="15.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
            <svg class="hs-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="right-icons">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <div class="profile">
              <div class="avatar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="header-divider"></div>

    <div class="search-dropdown" id="dropdown">
      <div class="sugg-list" id="suggList"></div>
      <div class="sugg-footer"><span class="sugg-close" id="closeBtn">닫기</span></div>
    </div>
  </div>

  <!-- ===================== HERO ===================== -->
  <div class="hero">
    <div class="hero-title"><span class="accent">어떤 회사·직무</span>가 궁금하신가요?</div>
    <div class="hero-search" id="heroSearch">
      <input type="text" placeholder="회사·직무 키워드를 검색해 보세요" />
      <span class="s-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    </div>

    <div class="ticker">
      <div class="live"><span class="dot"></span><span class="live-tx">실시간</span></div>
      <div class="vbar"></div>
      <div class="body">
        <div class="rk">
          <span class="rnum">3</span><span class="rname">무신사</span>
          <span class="new">NEW</span>
        </div>
        <span class="delta">2 <svg width="10" height="10" viewBox="0 0 12 12" fill="currentColor"><path d="M6 3l4 6H2z"/></svg></span>
      </div>
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    </div>

    <div class="quick" id="quick"></div>
  </div>

  <!-- ===================== CONTENT ===================== -->
  <div class="wrap">
    <div class="content">

      <!-- 마감 임박한 공고 -->
      <section>
        <div class="mhead">
          <div class="mtitle"><img class="micon" src="https://jelin-cc.github.io/jobplanet-ut/emoji-fire.svg" alt="" />마감 임박한 공고</div>
          <span class="more">전체보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
        <div class="dl-banner">
          <span class="dday">D-6</span>
          <span class="dl-tx">팔로우 회사 중 곧 마감되는 공고가 있어요!</span>
          <span class="dl-chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
        <div class="row" id="deadlineRow">
          <div class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
      </section>

      <!-- #연봉 언급 TOP 회사 -->
      <section>
        <div class="mhead">
          <div class="mtitle"><img class="micon" src="https://jelin-cc.github.io/jobplanet-ut/emoji-moneybag.svg" alt="" /><span class="orange">#연봉</span> 언급 TOP 회사</div>
          <span class="more">전체보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
        <div class="row" id="salaryRow"></div>
      </section>

      <!-- AD 배너 -->
      <section>
        <div class="ad-banner">
          <div class="ad-left">
            <div class="ad-illust">SQLD</div>
            <div class="ad-tx">6월 SQLD 응시 신청</div>
          </div>
          <div class="ad-cta">사이트 방문하기</div>
          <span class="ad-badge">광고 <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></span>
        </div>
      </section>

      <!-- 리뷰로 찾는 채용 공고 -->
      <section>
        <div class="mhead"><div class="mtitle">리뷰로 찾는 채용 공고</div></div>
        <div class="row" id="themeRow"></div>
      </section>

      <!-- 실시간 인기글 -->
      <section>
        <div class="mhead">
          <div class="mtitle"><img class="micon" src="https://jelin-cc.github.io/jobplanet-ut/emoji-bubble.svg" alt="" />실시간 인기글</div>
          <span class="more">전체보기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        </div>
        <div class="row" id="popularRow">
          <div class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>
        </div>
      </section>

    </div>
  </div>

<script>
  const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  const bm = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
  const tossLogo = '<span style="color:#3182F6;font-size:9px;font-weight:800;letter-spacing:-.3px">toss</span>';
  const naverLogo = '<span style="color:#03C75A;font-size:7px;font-weight:800;line-height:1.1;text-align:center">NAVER</span>';

  // ===== quick menu =====
  const base = 'https://jelin-cc.github.io/jobplanet-ut/';
  const quick = [
    {label:'지원현황', icon:'emoji-jp-apply.svg', n:true},
    {label:'이력서 관리', icon:'emoji-jp-resume.svg'},
    {label:'TOP<br>리뷰 회사', icon:'emoji-trophy.svg'},
    {label:'실연봉 비교', icon:'emoji-moneybag.svg'},
    {label:'회사 비교', icon:'emoji-balance.svg'},
  ];
  document.getElementById('quick').innerHTML = quick.map(q=>`
    <div class="qitem">
      <div class="qicon"><img src="${base+q.icon}" alt="" /></div>
      ${q.n?'<span class="qbadge">N</span>':''}
      <div class="qlabel">${q.label}</div>
    </div>`).join('');

  // ===== deadline job cards =====
  const jobs = [
    {logo:tossLogo, co:'비바퍼블리카', title:'[비바퍼블리카] 커머스 부문 프로덕트 디자이너', tags:['<span class="tag yellow">🎁 축하금 100만원</span>'], jk:true},
    {logo:naverLogo, co:'네이버파이넨셜', title:'[네이버파이넨셜] 헬스 프로덕트 디자이너 (5년차 이상)', tags:['<span class="tag green">워라밸 4.0</span>']},
    {logo:tossLogo, co:'비바퍼블리카', title:'[비바퍼블리카] 커머스 부문 프로덕트 디자이너 (3년차 이상)', tags:['<span class="tag green">워라밸 4.1</span>']},
  ];
  function jobCard(j){
    return `<div class="jcard">
      <div class="jc-top">
        <div class="jc-co"><span class="jc-logo">${j.logo}</span><span class="jc-coname">${j.co}</span></div>
        <span class="jc-bm">${bm}</span>
      </div>
      <div class="jc-title">${j.title}</div>
      <div class="jc-meta"><span class="jc-dday">D-6</span><span class="jc-dot">·</span><span class="jc-sub">경력무관</span><span class="jc-dot">·</span><span class="jc-sub">서울</span></div>
      <div class="jc-bottom"><div class="jc-tags">${j.tags.join('')}</div>${j.jk?'<span class="jc-jk">잡코리아 지원</span>':''}</div>
    </div>`;
  }
  document.getElementById('deadlineRow').insertAdjacentHTML('afterbegin', jobs.map(jobCard).join(''));

  // ===== salary review cards =====
  const salary = [
    {q:'안정적일 때 미래 먹거리를 위해 투자 할 줄 아는 회사 하지만 직원들 말을 귀담아 듣지는 않음', s:'대부분의 부서들이 워라밸 보장 근태관리가 시작되면서', co:'야놀자', logo:'<span style="color:#FF3478;font-size:9px;font-weight:800;letter-spacing:-.3px">yanolja</span>'},
    {q:'주변에 모자란 사람이 없다는게 가장 큰 장점, 매일 배우는 환경', s:'각 분야 전문가들과 협업, 코드 리뷰·문서들만 봐도 주변에', co:'당근', logo:'<span style="color:#FF6F0F;font-size:11px;font-weight:800;letter-spacing:-.3px">당근</span>'},
    {q:'금요일 반차가 디폴트, 주말이 길어서 컨디션 회복에 진심이에요', s:'주 4.5일제 정착, 연차·반차 사용도 눈치 안 보고 사용 가능해요', co:'네이버파이넨셜', logo:naverLogo},
  ];
  document.getElementById('salaryRow').innerHTML = salary.map(r=>`
    <div class="rcard">
      <div>
        <div class="rc-quote">${r.q}</div>
        <div class="rc-snip"><span class="tag blue">장점</span><span class="rc-txt">${r.s}</span></div>
      </div>
      <div class="rc-detail">자세히 보기 ${chev}</div>
      <div class="rc-div"></div>
      <div class="rc-co"><span class="jc-logo">${r.logo}</span><span class="name">${r.co}</span></div>
    </div>`).join('');

  // ===== theme cards =====
  const themes = [
    {pill:'최고의 보상', t:'성과만큼 챙겨주는 곳', s:'복리후생부터 보너스까지 든든하게', g:'linear-gradient(135deg,#ffd9a8,#ffb27a)'},
    {pill:'유연한 일터', t:'자율적으로 일하는 곳', s:'젊고 자유로운 사내문화', g:'linear-gradient(135deg,#a8d8ff,#7ab0ff)'},
    {pill:'탄탄한 규모', t:'한 번쯤 다녀보고 싶은 곳', s:'안정적인 비즈니스 기반', g:'linear-gradient(135deg,#c9d2e0,#9aa7bd)'},
    {pill:'믿고보는 동료', t:'함께하고 싶은 사람들이 모인 곳', s:'스마트한 동료, 수평한 관계', g:'linear-gradient(135deg,#bfe8d2,#8fd4ad)'},
  ];
  document.getElementById('themeRow').innerHTML = themes.map(t=>`
    <div class="tcard">
      <div class="tc-img" style="background:${t.g}"><span class="tc-pill">${t.pill}</span></div>
      <div class="tc-body"><div class="tc-title">${t.t}</div><div class="tc-sub">${t.s}</div></div>
    </div>`).join('');

  // ===== popular posts =====
  const heart = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"/></svg>';
  const comment = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8 9 9 0 0 1-4-1L3 20l1.5-4.5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>';
  const posts = [
    {b:'점심메뉴추천<br><br>1. 찌개·탕류: 김치찌개, 된장찌개, 순두부찌개, 부대찌개, 갈비탕, 감자탕, 설렁탕, 육개장, 곰탕, 해장국, 동태찌개, 청국장, 매운탕…', like:7, cmt:32, view:192},
    {b:'신입 분들, 말투 하나만 바꿔도 일 잘하는 사람처럼 보여요 🔥<br><br>요즘은 유연한 조직도 많아서 캐주얼한 말투도 좋지만, 말투는 곧 인상이기 때문에 딱 두 가지만 고치면 신뢰도 급상승합니다.', like:7, cmt:32, view:192},
    {b:'화장실갈 때 허락받아야 한다길래 도망쳤어요', like:7, cmt:32, view:192},
    {b:'상사와 사내 연애 해보신분?<br>6년 동안 장기연애한 여자친구가 제 상사인데요. 공식적으로 공개한 적은 없지만 주변에서도 다 아는 분위기예요. 회의만 들어가면 돌변합니다.', like:7, cmt:32, view:192},
  ];
  document.getElementById('popularRow').insertAdjacentHTML('afterbegin', posts.map(p=>`
    <div class="pcard">
      <div class="pc-body">${p.b}</div>
      <div class="pc-foot">
        <div class="grp"><span class="it">${heart} ${p.like}</span><span class="it">${comment} ${p.cmt}</span></div>
        <span class="view">조회 ${p.view}</span>
      </div>
    </div>`).join(''));

  /* ===================== HEADER MOTION ===================== */
  const wrap = document.getElementById('headerWrap');
  const heroSearch = document.getElementById('heroSearch');
  const headerSearch = document.getElementById('headerSearch');
  const hsInput = document.getElementById('hsInput');
  const hsClear = document.getElementById('hsClear');
  const dim = document.getElementById('dim');
  const dropdown = document.getElementById('dropdown');
  const suggList = document.getElementById('suggList');
  const closeBtn = document.getElementById('closeBtn');

  // (1) 스크롤 시 히어로 검색바가 헤더(56px) 아래로 가려지면 헤더 검색바 노출
  function onScroll(){
    const hidden = heroSearch.getBoundingClientRect().bottom <= 56;
    wrap.classList.toggle('scrolled', hidden);
    if(!hidden && wrap.classList.contains('active')) close();
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  // (2) 헤더 검색바 클릭 → GNB 페이드아웃 + 검색바 확장 + 드롭다운 (header-search.html 모션)
  const SUGGESTIONS = ['카카오','네이버','토스','프로덕트 디자이너','개발자 평균 연봉','UX 디자이너','스타트업 채용','재택근무 기업','비바퍼블리카','당근'];
  const SEARCH_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function hl(t,q){const safe=esc(t); if(!q) return safe; const re=new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return safe.replace(re,'<span class="hl">$1</span>');}
  function renderSugg(q){
    const query=(q||'').trim();
    const list=(query?SUGGESTIONS.filter(s=>s.toLowerCase().includes(query.toLowerCase())):SUGGESTIONS).slice(0,10);
    suggList.innerHTML = list.length ? list.map(s=>`<div class="sugg-row" data-value="${esc(s)}">${SEARCH_SVG}<span class="label">${hl(s,query)}</span></div>`).join('')
                                     : '<div class="sugg-empty">검색 결과가 없습니다</div>';
  }
  const SEARCH_W = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--search-w'),10)||620;
  function centerSearch(){
    const r = headerSearch.getBoundingClientRect();
    const expandedCenter = r.right - SEARCH_W/2;
    const dx = (document.documentElement.clientWidth/2) - expandedCenter;
    headerSearch.style.transform = 'translateX('+dx+'px)';
  }
  function open(){
    if(!wrap.classList.contains('scrolled')) return;
    centerSearch(); renderSugg(hsInput.value);
    wrap.classList.add('active'); dim.classList.add('active'); hsInput.focus();
  }
  function close(){
    headerSearch.style.transform=''; wrap.classList.remove('active'); dim.classList.remove('active'); hsInput.blur();
  }
  headerSearch.addEventListener('click', open);
  dim.addEventListener('click', close);
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') close(); });
  window.addEventListener('resize', ()=>{ if(wrap.classList.contains('active')) centerSearch(); });
  hsInput.addEventListener('input', ()=>{ hsClear.style.display = hsInput.value?'block':'none'; renderSugg(hsInput.value); });
  hsClear.addEventListener('click', e=>{ e.stopPropagation(); hsInput.value=''; hsClear.style.display='none'; renderSugg(''); hsInput.focus(); });
  suggList.addEventListener('click', e=>{ const row=e.target.closest('.sugg-row'); if(!row) return; hsInput.value=row.getAttribute('data-value'); hsClear.style.display='block'; renderSugg(hsInput.value); hsInput.focus(); });
  wrap.addEventListener('click', e=>e.stopPropagation());
</script>
</body>
</html>
