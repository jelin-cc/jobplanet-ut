<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>알림 닷 표시 예시</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
<style>
  :root{ --g900:#242628; --g500:#686A6D; --g400:#85878C; --g100:#E5E6E9; --g30:#F9F9FB; --red:#F44336; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Pretendard',system-ui,sans-serif; background:#F4F5F7; color:var(--g900);
       min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:64px 24px;}
  h1{font-size:20px; font-weight:700; margin-bottom:6px;}
  .sub{font-size:14px; color:var(--g500); margin-bottom:40px;}

  .grid{display:flex; gap:20px; flex-wrap:wrap; justify-content:center;}
  .card{width:240px; background:#fff; border:1px solid var(--g100); border-radius:16px;
        padding:32px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:20px;
        box-shadow:0 1px 4px rgba(0,0,0,.04);}
  .stage{height:48px; display:flex; align-items:center; justify-content:center;}
  .meta{text-align:center;}
  .meta .t{font-size:14px; font-weight:600;}
  .meta .d{font-size:12px; color:var(--g400); margin-top:4px; line-height:1.5;}

  /* 벨 아이콘 + 닷 공통 */
  .bell{position:relative; width:24px; height:24px; color:var(--g500); display:inline-flex;}
  .bell svg{width:24px; height:24px;}

  /* 1) 단순 닷 */
  .dot{position:absolute; top:1px; right:1px; width:7px; height:7px; border-radius:50%; background:var(--red);}

  /* 2) 흰 링 닷 (배경과 분리감) — 권장 */
  .dot-ring{position:absolute; top:0; right:0; width:9px; height:9px; border-radius:50%;
            background:var(--red); border:2px solid #fff; box-sizing:content-box;}

  /* 3) 카운트 배지 */
  .badge{position:absolute; top:-5px; right:-6px; min-width:16px; height:16px; padding:0 4px;
         border-radius:999px; background:var(--red); border:2px solid #fff;
         color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center;}

  /* 헤더 적용 예시 */
  .header-demo{margin-top:48px; width:520px; max-width:100%; background:#fff; border:1px solid var(--g100);
               border-radius:14px; height:56px; padding:0 20px; display:flex; align-items:center; justify-content:space-between;}
  .header-demo .logo{font-size:18px; font-weight:800; color:#00C274;}
  .header-demo .right{display:flex; align-items:center; gap:18px; color:var(--g500);}
  .header-demo .avatar{width:32px; height:32px; border-radius:6px; background:var(--g30); border:1px solid var(--g100);
                       display:flex; align-items:center; justify-content:center; color:var(--g500);}
  .caption{margin-top:12px; font-size:12px; color:var(--g400);}
</style>
</head>
<body>
  <h1>알림 아이콘 닷 표시</h1>
  <p class="sub">상황에 맞는 표시 방식을 선택하세요</p>

  <div class="grid">
    <div class="card">
      <div class="stage">
        <span class="bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot"></span>
        </span>
      </div>
      <div class="meta"><div class="t">단순 닷</div><div class="d">새 알림 유무만 표시<br>7px · Red-500</div></div>
    </div>

    <div class="card">
      <div class="stage">
        <span class="bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot-ring"></span>
        </span>
      </div>
      <div class="meta"><div class="t">흰 링 닷 (권장)</div><div class="d">아이콘과 분리되어 선명<br>9px + 흰 테두리 2px</div></div>
    </div>

    <div class="card">
      <div class="stage">
        <span class="bell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge">3</span>
        </span>
      </div>
      <div class="meta"><div class="t">카운트 배지</div><div class="d">읽지 않은 개수 표시<br>9+ 형태로 상한 처리</div></div>
    </div>
  </div>

  <!-- 헤더 적용 예시 -->
  <div class="header-demo">
    <span class="logo">Jobplanet</span>
    <span class="right">
      <span class="bell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot-ring"></span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span class="avatar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
    </span>
  </div>
  <p class="caption">↑ 실제 헤더 적용 예시 (흰 링 닷)</p>

</body>
</html>
